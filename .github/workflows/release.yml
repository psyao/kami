name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Keeps the release pull request up to date; merging it tags v* and publishes the GitHub Release
# (release policy, psyao/kami#30). Settings live in release-please-config.json.
jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tags, releases, the release branch
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
