name: tests

on:
  pull_request:
  # Nightly on main: catches a change on the starter kit's `next` or upstream that breaks Kami before the next pull request does.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The test strategy's matrix (psyao/kami#29, ADR 0031). No step retries a failing test.
jobs:
  lowest:
    name: Lowest (MariaDB 10.11, Infomaniak ini)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: kami
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kami
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          dependencies: lowest

      # The ini is loaded by the script, after Composer, which needs proc_open; serial, since Paratest needs it too.
      - name: Kami suite under the Infomaniak ini
        run: bash tests/infomaniak.sh --ci

  static:
    name: Static (SQLite, checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks reads the whole history

      - uses: ./.github/actions/setup
        id: setup

      # Each check runs once the environment is ready, so one push reports every failure.
      - name: Pint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/pint --test --parallel

      - name: Larastan
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: composer analyse # the table format annotates the pull request on GitHub Actions

      - name: Rector
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/rector --dry-run --no-progress-bar

      - name: gitleaks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner

      - name: Composer audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: composer audit --abandoned=report # an abandoned dependency is not an advisory

      - name: zizmor
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }} # online audits: impostor commits, known-vulnerable actions
        run: pipx run zizmor==1.31.1 --format=github .

      # ADR 0034. A package offering several licences passes when one of them is allowed.
      - name: Licences
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -o pipefail
          refused=$(composer licenses --no-dev --format=json | jq -r '.dependencies | to_entries[]
            | select(.value.license | any(IN("MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "ISC")) | not)
            | "::error::\(.key) is \(.value.license | join(" or ") | if . == "" then "unlicensed" else "licensed " + . end): an ADR must admit it first"')
          echo "$refused"
          test -z "$refused"

      # .gitattributes: the archive's top-level entries, and docs/ one level down, match this list exactly.
      # A new one ships, with a line here, or is export-ignored.
      - name: Archive contents
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -o pipefail
          git archive HEAD | tar -t | grep -v '/$' \
            | awk -F/ '$1 == "docs" && NF > 2 { print $1 "/" $2; next } { print $1 }' | sort -u \
            | diff -u <(printf '%s\n' CHANGELOG.md GLOSSARY.md LICENSE.md README.md SECURITY.md UPGRADING.md \
                composer.json config database docs/adr docs/guide docs/reference pint.json rector-set.php resources src | sort) -

      # ADR 0010: the reference is generated from the public surface, so a stale or missing page fails here.
      - name: Reference
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          composer reference
          stale=$(git status --porcelain -- docs/reference)
          if [ -n "$stale" ]; then
            echo "::error::docs/reference is stale: run composer reference and commit the result"
            echo "$stale"
            git diff -- docs/reference
            exit 1
          fi

      # ADR 0010: a removed or changed snapshot line can break a site, so the pull request must say so where release-please
      # reads it after the squash merge: `!` in its title, or a `BREAKING CHANGE:` footer in a commit. Added lines pass,
      # and so does a final method that only gains optional trailing parameters (tests/breaking-changes.php).
      - name: Breaking changes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          snapshot=tests/.pest/snapshots/Kami/PublicSurfaceTest/it_snapshots_the_public_surface.snap
          git show "$(git merge-base "$BASE" HEAD):$snapshot" > "$RUNNER_TEMP/before.snap"
          removed=$(php tests/breaking-changes.php "$RUNNER_TEMP/before.snap" "$snapshot")
          if [ -n "$removed" ] && ! echo "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
            && ! git log --format=%B "$BASE"..HEAD | grep -qE '^BREAKING[ -]CHANGE:'; then
            echo "::error::The public surface lost or changed these lines: mark the title with ! or add a BREAKING CHANGE: footer, then push again"
            echo "$removed"
            exit 1
          fi

  # Beside Static, so the checks do not delay it.
  coverage:
    name: Coverage (SQLite, Kami and Install suites)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        id: setup
        with:
          coverage: pcov

      - name: Kami suite with coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: composer test:coverage

      # Serial and without coverage: its `view:cache` clears the compiled views other workers render from.
      - name: Install suite
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/pest --testsuite=Install --ci

  postgresql:
    name: PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kami
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kami
      DB_USERNAME: postgres
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Kami suite
        run: vendor/bin/pest --testsuite=Kami --parallel --ci

      # The rest of the Install suite is bound to SQLite. This lookup hands out every Permission and depends on the engine.
      - name: First administrator
        run: vendor/bin/pest tests/Install/FirstAdministratorTest.php --ci

  mysql:
    name: MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: kami
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kami
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Kami suite
        run: vendor/bin/pest --testsuite=Kami --parallel --ci

      # The rest of the Install suite is bound to SQLite. This lookup hands out every Permission and depends on the engine.
      - name: First administrator
        run: vendor/bin/pest tests/Install/FirstAdministratorTest.php --ci

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # No --with-deps: the runner image's Google Chrome already brings Chromium's libraries,
      # and apt on the Ubuntu mirror took up to 7 minutes.
      - name: Install Playwright Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Browser suite
        run: vendor/bin/pest --testsuite=Browser --ci --trace

      # A failed test leaves a screenshot and a Playwright trace (console, network, DOM): open the trace on trace.playwright.dev.
      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures
          path: |
            tests/Browser/Screenshots
            tests/Browser/Traces

  smoke:
    name: Smoke (Apache + FPM, MariaDB 10.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build took about 70 % of this job (psyao/kami#161). `load` fetches the layers into the builder: without it
      # a cache hit stays lazy and run.sh's `up --build` rebuilds everything. A new Dockerfile, php or composer image
      # digest misses the cache; until then the apt packages stay as built.
      - name: PHP image cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/Smoke
          tags: kami-smoke-php
          load: true
          cache-from: type=gha
          cache-to: type=gha,ignore-error=true

      # Composer runs inside the stack, so the job needs no PHP of its own (docs/development.md).
      - name: Shared-hosting smoke
        run: tests/Smoke/run.sh

      - name: Stack logs
        if: failure()
        run: docker compose -f tests/Smoke/compose.yaml logs
