laravel: '@testbench'

env:
  - AUTH_MODEL="Workbench\\App\\Models\\User"
  - DB_CONNECTION=sqlite # the command line's default: the suites never read this key, and take `testing` from phpunit.xml.dist or the engine from CI's environment

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin'
  discovers:
    config: true
    views: true
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - filament-assets # the Install suite empties the skeleton's public/
