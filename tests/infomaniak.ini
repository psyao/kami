; Infomaniak shared hosting's web (FPM) PHP settings, measured on aguet.dev's host on 2026-10-25 and 2026-10-26
; (docs/velox-retrospective.md § 5.1). zend.assertions is the host's value; allow_url_fopen is the Manager's toggle.
; The Lowest job runs the Kami suite under this file, serially: Paratest needs proc_open.
; max_execution_time stays out: in the CLI it would bound the whole run.
disable_functions = exec,mail,passthru,pcntl_exec,popen,proc_open,shell_exec,system
opcache.enable_cli = 0
memory_limit = 640M
allow_url_fopen = 0
zend.assertions = 1
date.timezone = Europe/Zurich
