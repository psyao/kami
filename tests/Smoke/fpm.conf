; The host's web-only settings, measured on aguet.dev (docs/velox-retrospective.md § 5.1), on top of tests/infomaniak.ini.
[www]
pm.max_children = 20
; An unanswered request dies at 120 s of wall time, with no PHP shutdown.
request_terminate_timeout = 120s

; php_value, not php_admin_value: set_time_limit() works on the host.
php_value[max_execution_time] = 60
php_value[upload_max_filesize] = 300M
php_value[post_max_size] = 300M
php_value[max_input_vars] = 10000
php_admin_value[max_file_uploads] = 100
php_admin_value[max_input_time] = 0
php_admin_flag[opcache.enable] = off
php_flag[display_errors] = on

; The log the smoke requires empty.
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php/error.log
